events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    upstream portal_service { server portal:3000; }
    upstream api_service    { server api:3001; }
    upstream admin_service  { server admin:3002; }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name billing.vybeafrica.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Production HTTPS Server for billing.vybeafrica.org
    server {
        listen 443 ssl;
        http2 on;
        server_name billing.vybeafrica.org;

        ssl_certificate /etc/letsencrypt/live/billing.vybeafrica.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/billing.vybeafrica.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Captive Portal Probe Redirections (RFC 8952 / Android / Apple)
        location /generate_204 { return 302 /hotspot; }
        location /hotspot-detect.html { return 302 /hotspot; }
        location /ncsi.txt { return 302 /hotspot; }

        # Backend API routes
        location /api/ {
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Admin Dashboard
        location /admin/ {
            proxy_pass http://admin_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Captive Portal Customer Frontend
        location / {
            proxy_pass http://portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
