# FreeRADIUS rlm_sql PostgreSQL configuration
sql {
    dialect = "postgresql"
    driver = "rlm_sql_postgresql"

    # Connection parameters to PostgreSQL container
    server = "postgres"
    port = 5432
    login = "wifibilling"
    password = "wifibilling_secure_pass"
    radius_db = "wifi_billing_db"

    # Connection pool
    pool {
        start = 5
        min = 4
        max = 30
        spare = 3
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }

    # Read clients from 'nas' table
    read_clients = yes
    nas_table = "nas"

    # Table names
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    authreply_table = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"
    client_table = "nas"
    group_attribute = "SQL-Group"

    # Dialect-specific query templates
    $INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}
