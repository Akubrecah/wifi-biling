# FreeRADIUS NAS Clients Configuration
# Defines routers authorized to send Access-Request and Accounting packets

client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = testing123_production_radius_secret
    require_message_authenticator = no
    nas_type = other
}

client docker_network {
    ipaddr = 172.16.0.0/12
    proto = *
    secret = testing123_production_radius_secret
    require_message_authenticator = no
    nas_type = other
}

# Local MikroTik Hotspot Subnet / Gateway
client mikrotik_gateway {
    ipaddr = 192.168.88.0/24
    proto = *
    secret = testing123_production_radius_secret
    require_message_authenticator = no
    nas_type = mikrotik
}

# Any NAS from dynamic database (reads 'nas' table in PostgreSQL)
client dynamic_nas_sql {
    ipaddr = 0.0.0.0/0
    proto = *
    secret = testing123_production_radius_secret
    require_message_authenticator = no
    nas_type = mikrotik
}
